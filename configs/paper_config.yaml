# DTS-GSSF Paper-Stated Hyperparameters
# This file captures all hyperparameter values as claimed in the thesis paper.
# Use with: python main.py --config configs/paper_config.yaml

# Window configuration
lookback: 72
horizon: 4

# Data split
train_frac: 0.70
val_frac: 0.15
test_frac: 0.15

# Model architecture
d_model: 192
K: 3
lora_r: 16
dropout: 0.1
alpha_phys: 0.6
d_emb: 16
lora_alpha: 16.0

# Training
epochs: 30
batch_size: 32
lr: 3e-4
lr_min: 1e-6
weight_decay: 1e-3
grad_clip: 1.0
warmup_epochs: 20
use_cosine_schedule: true
early_stopping_patience: 50
early_stopping_min_delta: 1e-4
accumulation_steps: 1

# Loss weights
loss_bottom_weight: 1.3
loss_agg_weight: 0.7

# Optimizer (paper uses Adam, not AdamW)
optimizer: Adam

# Data generation
seed: 7
stations: 28
lines: 9
days: 365
freq_min: 10