services:
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8100:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/michi.db
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app
    depends_on:
      - redis
    volumes:
      - backend_data:/app/data

  dashboard:
    build: ./dashboard
    ports:
      - "3100:80"
    depends_on:
      - backend

  streamlit:
    build: .
    ports:
      - "8600:8501"
    environment:
      - API_URL=http://backend:8000
    depends_on:
      - backend

  celery:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A backend.tasks worker --loglevel=info
    environment:
      - DATABASE_URL=sqlite:///./data/michi.db
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app
    depends_on:
      - redis
    volumes:
      - backend_data:/app/data

  celery-beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A backend.tasks beat --loglevel=info
    environment:
      - DATABASE_URL=sqlite:///./data/michi.db
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app
    depends_on:
      - redis

volumes:
  backend_data: