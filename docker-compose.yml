services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./michi.db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      - backend_data:/app/data

  dashboard:
    build: ./dashboard
    ports:
      - "80:80"
    depends_on:
      - backend

  streamlit:
    build: .
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8000
    depends_on:
      - backend

  celery:
    build: ./backend
    command: celery -A backend.tasks worker --loglevel=info
    environment:
      - DATABASE_URL=sqlite:///./michi.db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  celery-beat:
    build: ./backend
    command: celery -A backend.tasks beat --loglevel=info
    environment:
      - DATABASE_URL=sqlite:///./michi.db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

volumes:
  backend_data:
