[project]
name = "michi"
version = "0.1.0"
description = "Astana passenger flow forecasting platform with real OSM data, FastAPI backend, React dashboard, and Docker deployment"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.4.1",
    "pandas>=2.3.3",
    "plotly>=6.5.1",
    "statsmodels>=0.14.6",
    "streamlit>=1.52.2",
    "torch>=2.9.1",
    "watchdog>=6.0.0",
    "xgboost>=3.1.3",
    "osmnx>=2.0.0",
    "requests>=2.32.0",
    "shapely>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.10",
    "redis>=5.2.0",
    "celery>=5.4.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
    "alembic>=1.14.0",
]
