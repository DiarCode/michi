services:
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8100:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/michi.db
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - backend_data:/app/data

  dashboard:
    build: ./dashboard
    ports:
      - "3100:80"
    depends_on:
      - backend

  streamlit:
    build: .
    ports:
      - "8600:8501"
    environment:
      - API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  celery:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A backend.tasks worker --loglevel=info
    environment:
      - DATABASE_URL=sqlite:///./data/michi.db
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - backend_data:/app/data

  celery-beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A backend.tasks beat --loglevel=info
    environment:
      - DATABASE_URL=sqlite:///./data/michi.db
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - backend_data:/app/data

volumes:
  backend_data: